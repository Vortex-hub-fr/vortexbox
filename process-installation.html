<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VortexBox | Processus Installation VB</title>
    <link rel="icon" type="image/svg+xml" href="favicon-vb.svg" />
    <link rel="stylesheet" href="styles.css?v=20260310premium18" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        color: #eaf7ff;
        background:
          radial-gradient(circle at 12% 8%, rgba(127, 231, 255, 0.24), transparent 36%),
          linear-gradient(160deg, #07192f, #04101f);
      }
      .card {
        width: min(760px, 92vw);
        border: 1px solid rgba(127, 231, 255, 0.34);
        border-radius: 16px;
        padding: 24px;
        background: linear-gradient(170deg, rgba(11, 35, 62, 0.92), rgba(7, 24, 44, 0.94));
        box-shadow: 0 24px 42px rgba(0, 0, 0, 0.36);
      }
      h1 { margin: 0 0 10px; font-size: clamp(24px, 4.2vw, 34px); }
      p { margin: 0 0 14px; color: #c8e3f7; line-height: 1.45; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .btn {
        display: inline-block;
        border: 1px solid rgba(127, 231, 255, 0.4);
        border-radius: 10px;
        padding: 11px 15px;
        font-weight: 700;
        text-decoration: none;
        color: #071f39;
        background: linear-gradient(90deg, #6ddfff, #6cb8ff);
      }
      .btn.secondary {
        background: rgba(8, 31, 54, 0.88);
        color: #e8f6ff;
      }
    </style>
  </head>
  <body>
    <article class="card">
      <h1>Installation VB</h1>
      <p>Accès premium aux dossiers PDF d'installation VortexBox. Cette page ouvre directement l'onglet Processus > Installation VB.</p>
      <div class="actions">
        <a class="btn" href="./index.html?openAdmin=1&adminTab=processus&processSubtab=docs">Ouvrir Installation VB</a>
        <a class="btn secondary" href="./index.html">Retour au site</a>
      </div>
    </article>
  

    <section class="vortexbot" id="vortexbot" aria-label="Assistant VortexBot">
      <button class="vortexbot-toggle" id="vortexbot-toggle" type="button" aria-expanded="false" aria-controls="vortexbot-panel">
        <span class="vortexbot-icon" aria-hidden="true"><img src="favicon-vb.svg" alt="" /></span>
        <span>VortexBot</span>
      </button>
      <div class="vortexbot-panel hidden" id="vortexbot-panel">
        <div class="vortexbot-head">
          <div class="vortexbot-head-title">
            <h3>VortexBot</h3>
            <p>Assistant VortexBox</p>
          </div>
          <button class="vortexbot-close" id="vortexbot-close" type="button" aria-label="Fermer">×</button>
        </div>
        <div class="vortexbot-messages" id="vortexbot-messages">
          <p class="vortexbot-msg bot">Je peux vous aider à revenir rapidement aux sections principales.</p>
        </div>
        <div class="vortexbot-actions">
          <button type="button" data-bot-action="go-home">Retour accueil</button>
          <button type="button" data-bot-action="go-telegram">Contacter sur Telegram</button>
        </div>
      </div>
    </section>

    <script>
      (function(){
        const toggle=document.getElementById('vortexbot-toggle');
        const panel=document.getElementById('vortexbot-panel');
        const close=document.getElementById('vortexbot-close');
        if(!toggle||!panel) return;
        const setOpen=(open)=>{
          panel.classList.toggle('hidden',!open);
          toggle.setAttribute('aria-expanded',open?'true':'false');
        };
        toggle.addEventListener('click',()=>setOpen(panel.classList.contains('hidden')));
        close&&close.addEventListener('click',()=>setOpen(false));
        panel.addEventListener('click',(event)=>{
          const btn=event.target.closest('button[data-bot-action]');
          if(!btn) return;
          const a=btn.dataset.botAction;
          if(a==='go-home') window.location.href='index.html';
          if(a==='go-telegram') window.open('https://t.me/vortexboxpro','_blank','noopener,noreferrer');
        });
      })();
    </script>

  </body>
  </html>
