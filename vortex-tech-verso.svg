<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">VortexBox Verso Fiche Technique</title>
  <desc id="desc">Visuel verso premium bleu gaming pour fiches techniques VortexBox.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07162b"/>
      <stop offset="45%" stop-color="#0b2e56"/>
      <stop offset="100%" stop-color="#071a33"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.2" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#43deff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#43deff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0.9" cy="0.85" r="0.55">
      <stop offset="0%" stop-color="#2f7dff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2f7dff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fe7ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#7fe7ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7fe7ff" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#glowA)"/>
  <rect width="900" height="1200" fill="url(#glowB)"/>

  <g opacity="0.35" stroke="url(#line)" stroke-width="2" fill="none">
    <path d="M70 160 H360 V270 H520 V190 H800"/>
    <path d="M100 350 H300 V510 H480 V440 H760"/>
    <path d="M80 640 H260 V760 H420 V700 H760"/>
    <path d="M120 890 H330 V1030 H530 V960 H820"/>
    <path d="M720 120 H600 V250 H430 V180 H160"/>
    <path d="M760 500 H580 V620 H410 V560 H160"/>
  </g>

  <g fill="#7fe7ff" opacity="0.85">
    <circle cx="360" cy="160" r="6"/>
    <circle cx="520" cy="270" r="6"/>
    <circle cx="300" cy="510" r="6"/>
    <circle cx="480" cy="440" r="6"/>
    <circle cx="260" cy="760" r="6"/>
    <circle cx="420" cy="700" r="6"/>
    <circle cx="330" cy="1030" r="6"/>
    <circle cx="530" cy="960" r="6"/>
  </g>

  <g transform="translate(450 600)">
    <circle r="180" fill="#0a335c" opacity="0.9"/>
    <circle r="176" fill="none" stroke="#6fe7ff" stroke-opacity="0.7" stroke-width="4"/>
    <circle r="150" fill="none" stroke="#2ea4ff" stroke-opacity="0.45" stroke-width="2"/>
    <circle r="122" fill="#092b4e" opacity="0.95"/>
    <g filter="url(#soft)">
      <text x="0" y="22" text-anchor="middle" fill="#9cf2ff" font-family="Sora, Rajdhani, Arial, sans-serif" font-size="112" font-weight="800">VB</text>
    </g>
    <text x="0" y="24" text-anchor="middle" fill="#dffbff" font-family="Sora, Rajdhani, Arial, sans-serif" font-size="106" font-weight="800">VB</text>
  </g>

  <g font-family="Sora, Rajdhani, Arial, sans-serif" text-anchor="middle">
    <text x="450" y="980" fill="#eaf8ff" font-size="44" font-weight="700">VortexBox</text>
    <text x="450" y="1030" fill="#9fd8ff" font-size="28" font-weight="500">Build gaming premium • Performance • Fiabilité</text>
  </g>

  <rect x="42" y="42" width="816" height="1116" rx="22" ry="22" fill="none" stroke="#79e5ff" stroke-opacity="0.28" stroke-width="2"/>
</svg>
